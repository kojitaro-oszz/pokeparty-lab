<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>PokéParty Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#1b1f2a;--mu:#667;--bd:#dde1ea;--ac:#e3350d;--ok:#1a8f4c;--ng:#d62839;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--sf:#1c212b;--tx:#eceff5;--mu:#9aa3b5;--bd:#2d3442;--ok:#4cd187;--ng:#ff6b78}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}h1{font-size:20px;margin:4px 0}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.t{display:inline-block;padding:1px 8px;border-radius:99px;color:#fff;font-size:12px;margin:1px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{border:1px dashed var(--bd);border-radius:10px;min-height:74px;padding:6px;text-align:center;font-size:13px}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:6px 10px;min-height:36px}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.note{color:var(--mu);font-size:12px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.w{color:var(--ng);font-weight:700}.r{color:var(--ok)}.badge{background:var(--ng);color:#fff;border-radius:6px;padding:0 6px;font-size:11px}
</style></head><body><main>
<h1>PokéParty Lab <span class="note">第1段階 試作版</span></h1>
<div class="card"><h2>1. 作品を選ぶ</h2><select id="g"></select><div class="note" id="gn"></div></div>
<div class="card"><h2>2. ポケモンを探す</h2><input id="q" placeholder="名前または図鑑番号（例：ピカ / 6）"><div class="res" id="res"></div>
<div class="note">※検索対象はサンプル24匹のみ（全種は第3段階以降で追加予定）</div></div>
<div class="card"><h2>3. 手持ち（最大6匹）</h2><div class="slots" id="slots"></div></div>
<div class="card"><h2>4. タイプ相性分析</h2><div id="an"></div></div>
<div class="card note">未実装：パーティ保存・代替提案・技/特性/種族値・PokéAPI連携。作品別の技や入手可否は「準備中」です。タイプ相性は第1世代／第2〜5世代／第6世代以降の3方式で計算しています（作品ごとの細かな差の検証は未完了）。</div>
</main>
<script>
/*LOGIC_START*/
const TYPES=["ノーマル","ほのお","みず","でんき","くさ","こおり","かくとう","どく","じめん","ひこう","エスパー","むし","いわ","ゴースト","ドラゴン","あく","はがね","フェアリー"];
const COL=["#a8a77a","#ee8130","#6390f0","#f7d02c","#7ac74c","#96d9d6","#c22e28","#a33ea1","#e2bf65","#a98ff3","#f95587","#a6b91a","#b6a136","#735797","#6f35fc","#705746","#b7b7ce","#d685ad"];
const N=n=>TYPES.indexOf(n);
// 第6世代以降の基準表：攻撃側 -> [抜群, いまひとつ, 無効]
const B={ノーマル:[[],["いわ","はがね"],["ゴースト"]],ほのお:[["くさ","こおり","むし","はがね"],["ほのお","みず","いわ","ドラゴン"],[]],
みず:[["ほのお","じめん","いわ"],["みず","くさ","ドラゴン"],[]],でんき:[["みず","ひこう"],["でんき","くさ","ドラゴン"],["じめん"]],
くさ:[["みず","じめん","いわ"],["ほのお","くさ","どく","ひこう","むし","ドラゴン","はがね"],[]],こおり:[["くさ","じめん","ひこう","ドラゴン"],["ほのお","みず","こおり","はがね"],[]],
かくとう:[["ノーマル","こおり","いわ","あく","はがね"],["どく","ひこう","エスパー","むし","フェアリー"],["ゴースト"]],どく:[["くさ","フェアリー"],["どく","じめん","いわ","ゴースト"],["はがね"]],
じめん:[["ほのお","でんき","どく","いわ","はがね"],["くさ","むし"],["ひこう"]],ひこう:[["くさ","かくとう","むし"],["でんき","いわ","はがね"],[]],
エスパー:[["かくとう","どく"],["エスパー","はがね"],["あく"]],むし:[["くさ","エスパー","あく"],["ほのお","かくとう","どく","ひこう","ゴースト","はがね","フェアリー"],[]],
いわ:[["ほのお","こおり","ひこう","むし"],["かくとう","じめん","はがね"],[]],ゴースト:[["エスパー","ゴースト"],["あく"],["ノーマル"]],
ドラゴン:[["ドラゴン"],["はがね"],["フェアリー"]],あく:[["エスパー","ゴースト"],["かくとう","あく","フェアリー"],[]],
はがね:[["こおり","いわ","フェアリー"],["ほのお","みず","でんき","はがね"],[]],フェアリー:[["かくとう","ドラゴン","あく"],["ほのお","どく","はがね"],[]]};
function buildChart(mode){ // mode: 1 / 2 / 6
  const c=JSON.parse(JSON.stringify(B));
  if(mode<6){ // フェアリー無し
    for(const k in c){c[k]=c[k].map(a=>a.filter(x=>x!=="フェアリー"));}
    c.ゴースト[1].push("はがね");c.あく[1].push("はがね");
  }
  if(mode===1){
    for(const k in c){c[k]=c[k].map(a=>a.filter(x=>x!=="あく"&&x!=="はがね"));}
    c.むし[0].push("どく");c.どく[0].push("むし");
    c.ゴースト[2].push("エスパー");c.ゴースト[0]=["ゴースト"];
    c.こおり[1]=c.こおり[1].filter(x=>x!=="ほのお");
  }
  const types=TYPES.filter(t=>mode===1?!["あく","はがね","フェアリー"].includes(t):mode<6?t!=="フェアリー":true);
  return {c,types};
}
function mult(ch,atk,defTypes){let m=1;for(const d of defTypes){const [se,nv,im]=ch.c[atk];if(se.includes(d))m*=2;else if(nv.includes(d))m*=.5;else if(im.includes(d))m*=0;}return m;}
function analyze(ch,party){
  const rows=ch.types.map(t=>{const ms=party.map(p=>mult(ch,t,p.t));
    return {t,ms,weak:ms.filter(x=>x>1).length,res:ms.filter(x=>x>0&&x<1).length,imm:ms.filter(x=>x===0).length};});
  const cover=ch.types.map(d=>({d,by:[...new Set(party.flatMap(p=>p.t).filter(a=>mult(ch,a,[d])>1))]}));
  return {rows,cover};
}
/*LOGIC_END*/
// サンプルデータ（手入力・未照合）。min=その世代以降のみ登場。
const P=[[25,"ピカチュウ",["でんき"],1],[3,"フシギバナ",["くさ","どく"],1],[6,"リザードン",["ほのお","ひこう"],1],[9,"カメックス",["みず"],1],
[34,"ニドキング",["どく","じめん"],1],[65,"フーディン",["エスパー"],1],[94,"ゲンガー",["ゴースト","どく"],1],[103,"ナッシー",["くさ","エスパー"],1],[112,"サイドン",["じめん","いわ"],1],
[130,"ギャラドス",["みず","ひこう"],1],[131,"ラプラス",["みず","こおり"],1],[143,"カビゴン",["ノーマル"],1],[144,"フリーザー",["こおり","ひこう"],1],[145,"サンダー",["でんき","ひこう"],1],
[146,"ファイヤー",["ほのお","ひこう"],1],[149,"カイリュー",["ドラゴン","ひこう"],1],[150,"ミュウツー",["エスパー"],1],[212,"ハッサム",["むし","はがね"],2],[248,"バンギラス",["いわ","あく"],2],
[197,"ブラッキー",["あく"],2],[445,"ガブリアス",["ドラゴン","じめん"],4],[448,"ルカリオ",["かくとう","はがね"],4],[700,"ニンフィア",["フェアリー"],6],[59,"ウインディ",["ほのお"],1]];
const GAMES=[["赤・緑・青・ピカチュウ",1,1],["金・銀・クリスタル",2,2],["ルビー・サファイア・エメラルド／FRLG",2,3],["ダイヤモンド・パール・プラチナ／HGSS",2,4],["ブラック・ホワイト／B2W2",2,5],["X・Y／ORAS",6,6],["サン・ムーン／USUM／Let’s Go",6,7],["ソード・シールド／BDSP／LEGENDS アルセウス",6,8],["スカーレット・バイオレット",6,9]];
let game=0,party=[];const $=id=>document.getElementById(id);
const tb=n=>`<span class="t" style="background:${COL[N(n)]}">${n}</span>`;
function pt(p,mode){ // 第6世代未満ではフェアリー等を除外する簡易措置（ニンフィアは第6世代以降のみ）
  return p;}
function avail(p){return p[3]<=GAMES[game][2]||(p[3]===1);}
function render(){
  const [name,mode,gen]=GAMES[game];
  $("gn").textContent=`タイプ相性：${mode===1?"第1世代":mode===2?"第2〜5世代":"第6世代以降"}方式で計算／技・特性データ：準備中`;
  const q=$("q").value.trim();
  $("res").innerHTML="";
  P.filter(p=>p[3]<=(mode===1?1:mode===2?5:99)&&p[3]<= (game===0?1:game===1?2:game<=3?4:99)).filter(p=>!q||p[1].includes(q)||String(p[0])===q.replace(/^0+/,"")).forEach(p=>{
    const b=document.createElement("button");b.innerHTML=`#${p[0]} ${p[1]} ${p[2].map(tb).join("")}`;
    b.onclick=()=>{if(party.length<6){party.push({n:p[1],t:p[2],id:p[0]});render();}else alert("手持ちは6匹までです");};$("res").appendChild(b);});
  $("slots").innerHTML=Array.from({length:6},(_,i)=>{const p=party[i];return p?`<div class="slot"><b>${p.n}</b><br>${p.t.map(tb).join("")}<br><button onclick="party.splice(${i},1);render()">外す</button></div>`:`<div class="slot note">空き</div>`;}).join("");
  const ch=buildChart(mode);
  // 作品に存在しないタイプのポケモンは外す
  party=party.filter(p=>p.t.every(t=>ch.types.includes(t)));
  if(!party.length){$("an").innerHTML='<div class="note">ポケモンを1匹以上追加すると分析が表示されます。</div>';return;}
  const a=analyze(ch,party);
  const hot=a.rows.filter(r=>r.weak>=2&&r.weak>r.res+r.imm);
  const gaps=a.cover.filter(c=>!c.by.length).map(c=>c.d);
  let h=`<p><b>弱点が集中：</b>${hot.length?hot.map(r=>`${tb(r.t)} ${r.weak}匹`).join(" "):"目立った集中はありません"}</p>`;
  h+=`<p><b>攻撃面で抜群を取れない：</b>${gaps.length?gaps.map(tb).join(" "):"全タイプに抜群を取れます"}<br><span class="note">（手持ちのタイプ一致技のみで判定。技構成は未反映）</span></p>`;
  h+=`<div class="wrap"><table><tr><th>相手の技</th>${party.map(p=>`<th>${p.n}</th>`).join("")}<th>弱</th><th>耐</th></tr>`;
  a.rows.forEach(r=>{h+=`<tr><td>${tb(r.t)}</td>${r.ms.map(m=>`<td class="${m>1?"w":m<1?"r":""}">${m===0?"無":m===1?"−":"×"+m}</td>`).join("")}<td class="${r.weak>=2?"w":""}">${r.weak}</td><td class="r">${r.res+r.imm}</td></tr>`;});
  $("an").innerHTML=h+"</table></div>";
}
$("g").innerHTML=GAMES.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join("");
$("g").onchange=e=>{game=+e.target.value;render();};$("q").oninput=render;render();
</script></body></html>
